[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiodrivers"
description = "Database drivers for async Python."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cqlsh" }]
keywords = ["async", "asyncio", "database", "driver"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed"
]
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/cqlsh/aiodrivers"
Issues = "https://github.com/cqlsh/aiodrivers/issues"

[dependency-groups]
dev = ["pyright==1.1.414"]

[tool.setuptools.dynamic]
version = { attr = "aiodrivers.__version__" }

[tool.setuptools.packages.find]
include = ["aiodrivers*"]

[tool.setuptools.package-data]
aiodrivers = ["py.typed"]

[tool.pyright]
include = ["aiodrivers", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"